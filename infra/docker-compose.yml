# Target production topology (docs/15_deployment_strategy.md). Wired up in Phase 1+.
# Local development here does not use Docker: DB_DRIVER=pglite + simulator channel.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wpp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: wpp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://wpp:${POSTGRES_PASSWORD}@postgres:5432/wpp
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file: ../.env
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://wpp:${POSTGRES_PASSWORD}@postgres:5432/wpp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  coderunner:
    build:
      context: ..
      dockerfile: infra/Dockerfile.coderunner
    env_file: ../.env
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://wpp:${POSTGRES_PASSWORD}@postgres:5432/wpp
      # No Instagram/LLM secrets are mounted into the build sandbox (docs/10 §6).
    volumes:
      - ../data:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    restart: unless-stopped

  panel:
    build:
      context: ..
      dockerfile: infra/Dockerfile.panel
    env_file: ../.env
    depends_on: [api]
    expose: ["3100"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, panel]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
